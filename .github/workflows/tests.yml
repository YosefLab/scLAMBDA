name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e '.[dev,providers,excel]'
      - run: pytest -q
      - run: ./bin/lambdakit doctor
      - run: python -m build
      - run: python scripts/check_release.py dist/*.whl
  engine-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test,excel]'
      - run: pytest tests/test_lambdakit.py tests/test_consolidation.py -q -k 'not pipeline_nodes'
